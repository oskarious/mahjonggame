<!doctype html>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<html><body style="padding:24px 16px 16px;background:var(--bg)">
<style>
  .row { display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  .cap { font-size:.7rem; color:var(--ink-dim); text-align:center; margin-top:8px; }
  .cell { display:flex; flex-direction:column; align-items:center; }
</style>
<div class="row" style="--tw:34px">
  <div class="cell"><span class="tile slim"><span class="face"><img src="../../tiles/slim/man/2.svg" alt=""><span class="index man">2</span></span></span><div class="cap">plain</div></div>
  <div class="cell"><span class="tile slim glow-gold"><span class="face"><img src="../../tiles/slim/man/5r.svg" alt=""><span class="tint"></span><span class="index man red-five">5</span></span></span><div class="cap">dora</div></div>
  <div class="cell"><span class="tile slim glow-blue"><span class="face"><img src="../../tiles/slim/pin/3.svg" alt=""><span class="tint"></span><span class="index pin">3</span></span></span><div class="cap">match</div></div>
  <div class="cell"><span class="tile slim last"><span class="face"><img src="../../tiles/slim/sou/3.svg" alt=""><span class="index sou">3</span></span></span><div class="cap">last</div></div>
  <div class="cell"><span class="tile slim hint"><span class="face"><img src="../../tiles/slim/hon/e.svg" alt=""><span class="index honor">E</span></span></span><div class="cap">hint</div></div>
  <div class="cell"><span class="tile slim dim"><span class="face"><img src="../../tiles/slim/pin/4.svg" alt=""><span class="index pin">4</span></span></span><div class="cap">dim</div></div>
  <div class="cell"><span class="tile slim"><span class="face"><span class="back"></span></span></span><div class="cap">back</div></div>
</div>
<div class="row" style="--tw:40px">
  <div class="cell"><span class="tile classic"><span class="face"><img src="../../tiles/classic/Pin1.svg" alt=""><span class="index pin">1</span></span></span><div class="cap">classic</div></div>
  <div class="cell"><span class="tile classic glow-gold"><span class="face"><img src="../../tiles/classic/Man5-Dora.svg" alt=""><span class="tint"></span><span class="index man red-five">5</span></span></span><div class="cap">dora</div></div>
  <div class="cell"><span class="tile classic"><span class="face"><img src="../../tiles/classic/Hatsu.svg" alt=""><span class="index honor">G</span></span></span><div class="cap">green</div></div>
</div>
<script></script>
</body></html>
